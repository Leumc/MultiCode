[project]
name = "remote-dev-platform"
version = "0.1.0"
description = "Multi-user locked-down code-server control plane and C++ runner"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35.0",
]

[project.scripts]
remote-dev = "remote_dev.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_dev"]
